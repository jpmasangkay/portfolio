      html, body {

      }
      .boot-subtitle {

        font-size: 13px;
        color: #cbc4da;
      }
      .boot-bar-track {
        width: 100%;
        height: 4px;
        background: #232036;
        overflow: hidden;
      }
      .boot-bar-fill {
        width: 100%;
        height: 100%;
        background: #ebb03d;
        transform-origin: left center;
        transform: scaleX(0.18);
        transition: transform 0.2s ease;
        animation: bootPulse 1.4s ease-in-out infinite alternate;
      }
      @keyframes bootPulse {
        from { opacity: 0.65; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, .boot-bar-fill {
          transition: none;
          animation: none;
        }
      }
    </style>
