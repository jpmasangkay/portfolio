    <!-- Critical First-Paint Title Card Styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0812;
        color: #ebe4d6;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #0a0812;
        transition: opacity 0.28s ease;
        pointer-events: none;
      }
      #boot-splash.is-ready {
        opacity: 0;
      }
      .boot-card {
        width: min(360px, 100%);
        padding: 22px 24px;
        background: #121020;
        border: 1px solid #35304d;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-title {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ebb03d;
      }
      .boot-subtitle {
        margin: 0 0 16px;
        font-size: 13px;
        color: #cbc4da;
      }
      .boot-bar-track {
        width: 100%;
        height: 4px;
        background: #232036;
        overflow: hidden;
      }
      .boot-bar-fill {
        width: 100%;
        height: 100%;
        background: #ebb03d;
        transform-origin: left center;
        transform: scaleX(0.18);
        transition: transform 0.2s ease;
        animation: bootPulse 1.4s ease-in-out infinite alternate;
      }
      @keyframes bootPulse {
        from { opacity: 0.65; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, .boot-bar-fill {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
